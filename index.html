<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>
  </head>
  <body>
    <h1>Kanban</h1>

    <section>
      <h2>Board</h2>
      <label for="board-select">Select board:</label>
      <select id="board-select"></select>
    </section>

    <section>
      <h2>Add List</h2>
      <form id="add-list-form">
        <label for="list-name">List name</label>
        <input id="list-name" name="listName" type="text" required />
        <button type="submit">Add list</button>
      </form>
    </section>

    <section>
      <h2>Add Task</h2>
      <form id="add-task-form">
        <label for="task-list-select">List</label>
        <select id="task-list-select" name="listId" required></select>

        <label for="task-name">Task name</label>
        <input id="task-name" name="taskName" type="text" required />

        <label for="task-description">Task description</label>
        <textarea id="task-description" name="taskDescription" required></textarea>

        <button type="submit">Add task</button>
      </form>
    </section>

    <section>
      <h2>Lists and Tasks</h2>
      <div id="lists-root"></div>
    </section>

    <script src="./app.js"></script>
  </body>
  </html>
